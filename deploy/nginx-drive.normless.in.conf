# /etc/nginx/sites-available/drive.normless.in
#
# Install:
#   sudo cp nginx-drive.normless.in.conf /etc/nginx/sites-available/drive.normless.in
#   sudo ln -s /etc/nginx/sites-available/drive.normless.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d drive.normless.in
#
# Run certbot only after the A record for drive.normless.in resolves to this
# host, or the HTTP-01 challenge fails. certbot rewrites this file to add the
# TLS block and the :80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name drive.normless.in;

    # File bodies go straight through to Telegram without being buffered to
    # disk, so nginx must not try to buffer or cap them. 0 means "no limit" —
    # the app enforces its own per-file ceiling, nginx should not second-guess
    # it and return a 413 the app never sees.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # A multi-gigabyte upload through a slow client can legitimately hold a
    # connection open for a long time. The defaults (60s) would kill it
    # mid-transfer and the user would see a truncated upload with no error
    # worth reading.
    proxy_connect_timeout 60s;
    proxy_send_timeout    1h;
    proxy_read_timeout    1h;
    send_timeout          1h;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range requests must reach the app intact — share-link downloads of
        # split files rely on them to resume and to seek within a part.
        proxy_set_header Range  $http_range;
        proxy_set_header If-Range $http_if_range;

        # Upgrade for any websocket used by transfer progress.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

[package]
name = "normless-drive"
version = "0.1.0"
edition = "2021"
description = "Browser front end for Telegram-backed storage, with accounts and admin-controlled access"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"

# Postgres. Runtime-checked queries (`query`/`query_as`) rather than the
# compile-time `query!` macros, so a build does not need a reachable database.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Password hashing (login) and key derivation (session encryption). Same
# primitive, two different purposes — see docs/ARCHITECTURE.md section 2.1.
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std"] }

# Session-at-rest encryption.
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }

rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
